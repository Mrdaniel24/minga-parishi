<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nenosiri jipya | Mfumo wa Parokia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300..600,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/parish.css"/>
  <style>
    :root { --ink: #26332f; --muted: #6b7c77; --line: #dfe7e4; --primary: #3d5650; --primary-deep: #2c403b; --gold: #d4a72c; --canvas: #e6eeeb; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: 'Nunito Sans', system-ui, sans-serif; color: var(--ink); background: var(--canvas); display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 100vh; }
    .side { background: linear-gradient(160deg, var(--primary) 0%, var(--primary-deep) 100%); color: #fff; padding: clamp(2rem, 5vw, 4rem); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
    .side::after { content: ''; position: absolute; right: -120px; bottom: -120px; width: 340px; height: 340px; border-radius: 50%; border: 48px solid rgba(212, 167, 44, .16); }
    .eyebrow { font-size: .72rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
    .side h1 { font-size: clamp(1.9rem, 3.4vw, 2.8rem); font-weight: 900; line-height: 1.1; letter-spacing: -.02em; margin: .8rem 0 1rem; max-width: 18ch; }
    .side p { color: rgba(255, 255, 255, .78); max-width: 42ch; line-height: 1.55; margin: 0; }
    .points { list-style: none; padding: 0; margin: 2rem 0 0; display: grid; gap: .8rem; }
    .points li { display: flex; gap: .7rem; align-items: center; font-weight: 700; color: rgba(255, 255, 255, .9); }
    .points .material-symbols-outlined { color: var(--gold); font-size: 1.25rem; }
    .foot { font-size: .78rem; color: rgba(255, 255, 255, .55); position: relative; z-index: 1; }
    .form-side { display: flex; align-items: center; justify-content: center; padding: clamp(1.5rem, 4vw, 3rem); }
    .card { width: 100%; max-width: 400px; background: #fff; border-radius: 24px; padding: clamp(1.5rem, 4vw, 2.5rem); box-shadow: 0 1px 2px rgba(31, 52, 47, .04), 0 18px 40px -18px rgba(31, 52, 47, .25); }
    .card h2 { margin: 0 0 .3rem; font-size: 1.5rem; font-weight: 900; color: var(--primary); }
    .card .sub { margin: 0 0 1.6rem; color: var(--muted); font-size: .92rem; }
    label { display: block; font-size: .78rem; font-weight: 800; color: var(--muted); margin-bottom: 1rem; letter-spacing: .02em; }
    .field { position: relative; margin-top: .4rem; }
    .field .material-symbols-outlined { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); color: #9aaaa5; font-size: 1.2rem; pointer-events: none; }
    input { width: 100%; font: inherit; font-size: 1rem; color: var(--ink); padding: .8rem .9rem .8rem 2.6rem; border: 1.5px solid var(--line); border-radius: 12px; background: #fbfcfc; outline: none; transition: border-color .15s, box-shadow .15s; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(61, 86, 80, .12); background: #fff; }
    .show { position: absolute; right: .5rem; top: 50%; transform: translateY(-50%); background: none; border: 0; color: #9aaaa5; cursor: pointer; padding: .3rem; display: flex; }
    .show .material-symbols-outlined { position: static; transform: none; }
    button[type=submit] { width: 100%; margin-top: .4rem; font: inherit; font-weight: 900; font-size: 1rem; color: #fff; background: var(--primary); border: 0; border-radius: 12px; padding: .9rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: .5rem; transition: background .15s; }
    button[type=submit]:hover { background: var(--primary-deep); }
    button[type=submit]:disabled { opacity: .65; cursor: wait; }
    .msg { display: none; margin-bottom: 1rem; padding: .75rem .9rem; border-radius: 12px; font-size: .88rem; font-weight: 700; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .msg.show-msg { display: block; }
    .msg.ok { background: #ecfdf5; color: #166534; border-color: #a7f3d0; }
    .link { display: inline-block; margin-top: 1.1rem; font-size: .85rem; font-weight: 800; color: var(--primary); background: none; border: 0; cursor: pointer; padding: 0; }
    .help { margin-top: 1.4rem; padding-top: 1.1rem; border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); line-height: 1.5; }
    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; }
      .side { padding: 1.75rem 1.25rem 2.25rem; }
      .side h1 { font-size: 1.7rem; margin-bottom: .5rem; }
      .points, .foot { display: none; }
      .side::after { width: 200px; height: 200px; right: -80px; bottom: -90px; border-width: 30px; }
      .form-side { padding: 1rem; margin-top: -1.25rem; align-items: flex-start; }
    }
  </style>
</head>
<body style="grid-template-columns:1fr">
  <section class="form-side">
    <form class="card" id="reset" novalidate>
      <h2>Weka nenosiri jipya</h2>
      <p class="sub">Chagua nenosiri lenye herufi 8 au zaidi.</p>
      <div class="msg" id="msg" role="alert"></div>
      <label>Nenosiri jipya
        <span class="field"><span class="material-symbols-outlined">lock</span>
          <input type="password" name="p1" autocomplete="new-password" minlength="8" required></span></label>
      <label>Rudia nenosiri
        <span class="field"><span class="material-symbols-outlined">lock</span>
          <input type="password" name="p2" autocomplete="new-password" minlength="8" required></span></label>
      <button type="submit" id="go"><span class="material-symbols-outlined">key</span>Hifadhi nenosiri</button>
      <a class="link" href="login.html">← Rudi kuingia</a>
    </form>
  </section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
(() => {
  const form = document.getElementById('reset'), msg = document.getElementById('msg'), go = document.getElementById('go');
  const say = (t, ok) => { msg.textContent = t; msg.className = 'msg show-msg' + (ok ? ' ok' : ''); };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const a = form.p1.value, b = form.p2.value;
    if (a.length < 8) { say('Nenosiri liwe na herufi 8 au zaidi.'); return; }
    if (a !== b) { say('Manenosiri mawili hayalingani.'); return; }
    go.disabled = true;
    const { error } = await supabase.auth.updateUser({ password: a });
    go.disabled = false;
    if (error) { say(/session|auth/i.test(error.message) ? 'Kiungo kimeisha muda. Omba kiungo kipya kwenye ukurasa wa kuingia.' : error.message); return; }
    say('Nenosiri limebadilishwa. Unapelekwa kwenye mfumo…', true);
    setTimeout(() => location.replace('parish/index.html'), 1200);
  });
})();
</script>
</body>
</html>
