<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e7efec">
  <title>Jisajili | Mfumo wa Parokia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300..600,0,1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/parish.css">
  <style>
    :root{--green:#3d5650;--green-deep:#263d37;--gold:#d7ad3c;--ink:#26332f;--muted:#7b8b86;--line:#dfe8e4;--canvas:#e7efec}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:clamp(1rem,4vw,3rem);font-family:Montserrat,system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 10% 10%,#fff 0,transparent 42%),radial-gradient(ellipse at 90% 90%,#d5e4de 0,transparent 38%),var(--canvas)}
    .page{width:min(100%,760px);position:relative}.brand{display:flex;align-items:center;gap:.7rem;margin:0 0 1rem .35rem;color:var(--green);font-weight:800;font-size:.83rem;letter-spacing:.04em}.brand__mark{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;overflow:hidden;border:1.5px solid var(--gold);border-radius:50%;color:var(--gold);background:#fff}.brand__mark svg{display:block;width:22px;height:22px}
    .card{position:relative;overflow:hidden;padding:clamp(1.25rem,5vw,3rem);border:1px solid rgba(255,255,255,.9);border-radius:28px;background:rgba(255,255,255,.96);box-shadow:0 24px 80px rgba(43,69,61,.15);min-height:480px;display:flex;flex-direction:column;justify-content:space-between;animation:card-in .55s cubic-bezier(.2,.8,.2,1) both}
    .card::before{content:"";position:absolute;top:0;left:0;width:100%;height:5px;background:linear-gradient(90deg,var(--gold),#e8cf83,var(--green))}.top{display:flex;justify-content:space-between;align-items:center;gap:1rem}.top h1{margin:0;color:var(--green);font-size:1.05rem}.top a{display:flex;align-items:center;gap:.2rem;color:var(--green);font-size:.8rem;font-weight:700;text-decoration:none}
    .progress{margin:1.45rem 0 0}.progress__meta{display:flex;justify-content:space-between;gap:1rem;color:var(--muted);font-size:.7rem;font-weight:700}.progress__track{height:5px;margin-top:.55rem;overflow:hidden;border-radius:99px;background:#edf2f0}.progress__bar{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--green));transition:width .35s ease}
    .question-wrap{display:grid;align-content:center;min-height:280px;padding:2rem 0 1.1rem}.question{animation:question-in .38s cubic-bezier(.2,.75,.25,1) both}.question__icon{display:grid;place-items:center;width:48px;height:48px;margin-bottom:1.2rem;border-radius:16px;background:#fbf3d9;color:#8a6a19}.question__icon .material-symbols-outlined{font-size:26px}.question h2{margin:0;color:var(--green);font-size:clamp(1.35rem,4vw,1.9rem);line-height:1.25}.question p{max-width:52ch;margin:.65rem 0 1.4rem;color:var(--muted);font-size:.84rem;line-height:1.65}
    .answer{max-width:560px}.answer input,.answer select{width:100%;min-height:58px;padding:.9rem 1rem;border:1px solid #d6e2dd;border-radius:15px;outline:0;background:#fbfdfc;color:var(--ink);font:inherit;font-size:.96rem;transition:border-color .2s,box-shadow .2s,transform .2s}.answer input:focus,.answer select:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(215,173,60,.15);transform:translateY(-1px)}.answer input::placeholder{color:#a0ada8}.choices{display:grid;gap:.7rem;max-width:560px}.choice{display:flex;align-items:center;gap:.75rem;min-height:58px;padding:.8rem 1rem;border:1px solid var(--line);border-radius:15px;background:#fbfdfc;cursor:pointer;font-size:.85rem;font-weight:700;transition:.18s}.choice:hover{border-color:#b6c6bf;transform:translateY(-1px)}.choice:has(input:checked){border-color:var(--green);background:#f1f7f4;box-shadow:0 0 0 3px rgba(61,86,80,.08)}.choice input{width:18px;height:18px;accent-color:var(--green)}
    .notice{display:none;margin-top:1rem;padding:.75rem .9rem;border-radius:12px;font-size:.78rem;line-height:1.5}.notice.show{display:block;animation:pop-in .2s ease}.notice--error{background:#fff0f2;color:#8e2839;border:1px solid #f2c8cf}.notice--warn{background:#fff9e9;color:#745815;border:1px solid #f1df9e}.actions{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-top:auto;padding-top:1rem;border-top:1px solid var(--line)}.button{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:46px;padding:.7rem 1.15rem;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--green);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;transition:.18s}.button:hover{transform:translateY(-1px);border-color:#b7c8c0}.button--primary{border-color:var(--green);background:var(--green);color:#fff;box-shadow:0 7px 18px rgba(61,86,80,.18)}.button--primary:hover{background:var(--green-deep)}.button:disabled{opacity:.55;cursor:wait;transform:none}.button[hidden]{display:none}
    .review{display:grid;gap:.55rem;max-width:560px}.review__line{display:flex;justify-content:space-between;gap:1rem;padding:.7rem .85rem;border-radius:12px;background:#f6f9f7;font-size:.77rem}.review__line span:first-child{color:var(--muted)}.review__line strong{text-align:right}.success{display:none;text-align:center;padding:3rem 1rem;animation:pop-in .35s ease}.success.show{display:block}.success__icon{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 1rem;border-radius:50%;background:#e7f6ed;color:#23744f}.success h2{color:var(--green)}.success p{color:var(--muted);line-height:1.65}.success a{display:inline-flex;align-items:center;gap:.4rem;margin-top:.8rem;padding:.8rem 1.1rem;border-radius:99px;background:var(--green);color:white;font-weight:700;text-decoration:none}
    @keyframes card-in{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}@keyframes question-in{from{opacity:0;transform:translateX(16px) scale(.99)}to{opacity:1;transform:none}}@keyframes pop-in{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
    @media(max-width:520px){body{padding:.7rem}.card{min-height:calc(100dvh - 1.4rem);border-radius:22px;padding:1.15rem}.question-wrap{min-height:0;flex:1}.top h1{font-size:.93rem}.button{padding:.65rem .85rem}.question p{font-size:.8rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="page">
    <div class="brand"><span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16M6 21V10l6-4 6 4v11M9 21v-6h6v6M12 2v6m-3-3h6"/></svg></span><span>MFUMO WA PAROKIA</span></div>
    <section class="card" id="wizard-card">
      <div id="form-wrap">
        <header class="top"><h1>Usajili wa muumini</h1><a href="login.html"><span class="material-symbols-outlined">arrow_back</span>Ingia</a></header>
        <div class="progress"><div class="progress__meta"><span id="progress-label">Hatua ya 1</span><span id="progress-percent">0%</span></div><div class="progress__track"><div class="progress__bar" id="progress-bar"></div></div></div>
        <section class="question-wrap"><div id="question" class="question" aria-live="polite"></div><div id="notice" class="notice" role="alert"></div></section>
        <footer class="actions"><button type="button" class="button" id="back" hidden><span class="material-symbols-outlined">arrow_back</span>Rudi</button><span id="spacer"></span><button type="button" class="button button--primary" id="next">Endelea<span class="material-symbols-outlined">arrow_forward</span></button></footer>
      </div>
      <section id="success" class="success" aria-live="polite"><div class="success__icon"><span class="material-symbols-outlined">task_alt</span></div><h2>Usajili umekamilika</h2><p id="success-message"></p><a href="login.html"><span class="material-symbols-outlined">login</span>Ingia kwenye mfumo</a></section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script>
  (()=>{
    const q=document.getElementById('question'),notice=document.getElementById('notice'),next=document.getElementById('next'),back=document.getElementById('back');
    const rels=[['BABA','Baba'],['MAMA','Mama'],['MTOTO','Mtoto'],['MJUKUU','Mjukuu'],['BIBI','Bibi'],['BABU','Babu'],['KAKA','Kaka'],['DADA','Dada'],['MJOMBA','Mjomba'],['SHANGAZI','Shangazi'],['MWINGINE','Mwingine']];
    const state={kigango_id:'',jumuiya_id:'',is_head:null,family_id:'',new_family_name:'',members:[{full_name:'',relationship:'',gender:'',age:'',phone:''}],add_more:null,consent:false};
    let stepIndex=0,kigangoRows=[],jumuiyaRows=[],familyRows=[],busy=false;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const say=(s,type='error')=>{notice.textContent=s;notice.className=`notice notice--${type} show`};const clear=()=>{notice.textContent='';notice.className='notice'};
    const steps=()=>{const a=[{key:'kigango',title:'Kigango chako ni kipi?',help:'Chagua kigango unachoishi.'},{key:'jumuiya',title:'Upo jumuiya gani?',help:'Orodha inategemea kigango ulichochagua.'},{key:'head',title:'Je, wewe ni mkuu wa familia?',help:'Jibu hili litasaidia kukuunganisha na familia sahihi.',options:[{value:'yes',label:'Ndiyo, nitaanzisha familia'},{value:'no',label:'Hapana, nitaingia familia iliyopo'}]}];if(state.is_head===true)a.push({key:'new_family',title:'Familia yenu inaitwaje?',help:'Utaanzisha familia mpya na kuwekwa kama mkuu wake.',placeholder:'mf. Familia ya Mwakalinga'});if(state.is_head===false)a.push({key:'family',title:'Unahitaji kujiunga na familia ipi?',help:'Chagua familia iliyopo kwenye jumuiya yako.'});if(state.is_head!==null){state.members.forEach((m,i)=>{a.push({key:'name',i,title:i===0?'Jina lako kamili?':`Jina la mwanafamilia ${i+1}?`,help:'Tumia jina linalotambulika kwenye rejista.',placeholder:'Andika jina kamili'});a.push({key:'relation',i,title:'Uhusiano wake na familia ni upi?',help:'Chagua uhusiano wa mtu huyu na familia.',options:rels.map(([v,l])=>({value:v,label:l}))});a.push({key:'gender',i,title:'Jinsi yake ni ipi?',help:'Unaweza kuruka swali hili kama hutaki kuweka jinsi.',options:[{value:'female',label:'Mwanamke'},{value:'male',label:'Mwanaume'},{value:'',label:'Ruka swali hili'}]});a.push({key:'age',i,title:'Ana umri wa miaka mingapi?',help:'Andika umri wake kwa miaka.',type:'number',min:0,max:120,placeholder:'mf. 35'});a.push({key:'phone',i,title:'Namba yake ya simu ni ipi?',help:'Kila mtu anahitaji namba yake ya simu kwa akaunti na taarifa za kuingia.',type:'tel',placeholder:'0712 345 678'});});if(state.is_head)a.push({key:'more',title:'Unataka kusajili mwanafamilia mwingine?',help:'Kila mwanafamilia atasajiliwa kwa akaunti na namba yake ya simu.',options:[{value:'yes',label:'Ndiyo, ongeza mwanafamilia'},{value:'no',label:'Hapana, endelea'}]});a.push({key:'consent',title:'Una ruhusa ya kusajili watu hawa?',help:'Nenosiri la muda litatumwa kwenye simu ya kila mtu. Kila mtu atalibadilisha akiingia mara ya kwanza.'});a.push({key:'review',title:'Taarifa zako ziko tayari?',help:'Hakiki taarifa kabla ya kutuma usajili.'});}return a};
    function fieldHtml(s){if(s.key==='relation')return `<div class="answer"><select id="answer"><option value="">Chagua uhusiano…</option>${s.options.map(x=>`<option value="${esc(x.value)}" ${state.members[s.i].relationship===x.value?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div>`;if(s.options){const chosen=s.key==='head'?(state.is_head===null?'':state.is_head?'yes':'no'):s.key==='more'?(state.add_more===null?'':state.add_more?'yes':'no'):s.key==='gender'?state.members[s.i].gender:'';return `<div class="choices">${s.options.map(x=>`<label class="choice"><input type="radio" name="answer" value="${esc(x.value)}" ${String(chosen)===String(x.value)?'checked':''}><span>${esc(x.label)}</span></label>`).join('')}</div>`}if(s.key==='kigango'||s.key==='jumuiya'||s.key==='family'){const rows=s.key==='kigango'?kigangoRows:s.key==='jumuiya'?jumuiyaRows:familyRows;const value=state[s.key==='kigango'?'kigango_id':s.key==='jumuiya'?'jumuiya_id':'family_id'];return `<div class="answer"><select id="answer"><option value="">${s.key==='kigango'?'Chagua kigango…':s.key==='jumuiya'?'Chagua jumuiya…':'Chagua familia…'}</option>${rows.map(x=>`<option value="${esc(x.id)}" ${value===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`}if(s.key==='consent')return `<div class="choices"><label class="choice"><input type="checkbox" id="answer" ${state.consent?'checked':''}><span>Ndiyo, nina ruhusa ya kusajili taarifa hizi</span></label></div>`;return `<div class="answer"><input id="answer" type="${s.type||'text'}" ${s.min!==undefined?`min="${s.min}" max="${s.max}"`:''} placeholder="${esc(s.placeholder||'')}" value="${esc(s.key==='new_family'?state.new_family_name:state.members[s.i]?.[s.key==='name'?'full_name':s.key]||'')}" autocomplete="${s.key==='phone'?'tel':s.key==='name'?'name':'off'}"></div>`}
    function summaryHtml(){return `<div class="review"><div class="review__line"><span>Kigango</span><strong>${esc(kigangoRows.find(x=>x.id===state.kigango_id)?.name||'')}</strong></div><div class="review__line"><span>Jumuiya</span><strong>${esc(jumuiyaRows.find(x=>x.id===state.jumuiya_id)?.name||'')}</strong></div><div class="review__line"><span>Familia</span><strong>${esc(state.is_head?state.new_family_name:familyRows.find(x=>x.id===state.family_id)?.name||'')}</strong></div>${state.members.map((m,i)=>`<div class="review__line"><span>${esc(m.full_name||`Mwanafamilia ${i+1}`)} · ${esc(m.phone)}</span><strong>${esc(m.age)} yrs</strong></div>`).join('')}<div class="review__line"><span>Akaunti</span><strong>Muumini wa kawaida</strong></div></div>`}
    function render(){const all=steps();stepIndex=Math.max(0,Math.min(stepIndex,all.length-1));const s=all[stepIndex];clear();back.hidden=stepIndex===0;document.getElementById('progress-label').textContent=`Hatua ${stepIndex+1} kati ya ${all.length}`;const pct=Math.round(stepIndex/(all.length-1||1)*100);document.getElementById('progress-percent').textContent=`${pct}%`;document.getElementById('progress-bar').style.width=`${pct}%`;next.innerHTML=s.key==='review'?'<span class="material-symbols-outlined">how_to_reg</span>Thibitisha usajili':'Endelea<span class="material-symbols-outlined">arrow_forward</span>';q.innerHTML=`<div class="question__icon"><span class="material-symbols-outlined">${s.key==='review'?'fact_check':s.key==='phone'?'smartphone':s.key==='kigango'||s.key==='jumuiya'?'location_on':s.key==='head'||s.key==='more'?'family_restroom':s.key==='consent'?'verified_user':s.key==='age'?'cake':'person'}</span></div><h2>${esc(s.title)}</h2><p>${esc(s.help||'')}</p>${s.key==='review'?summaryHtml():fieldHtml(s)}`;if(s.key==='review')next.innerHTML='<span class="material-symbols-outlined">how_to_reg</span>Sajili';const answer=document.getElementById('answer');if(answer){if(s.key==='kigango')answer.addEventListener('change',async()=>{state.kigango_id=answer.value;state.jumuiya_id='';state.family_id='';jumuiyaRows=[];familyRows=[];if(state.kigango_id)await loadJumuiya();});else if(s.key==='jumuiya')answer.addEventListener('change',async()=>{state.jumuiya_id=answer.value;state.family_id='';familyRows=[];if(state.jumuiya_id&&state.is_head===false)await loadFamilies();});else if(s.key==='family')answer.addEventListener('change',()=>state.family_id=answer.value);else if(s.key==='consent')answer.addEventListener('change',()=>state.consent=answer.checked);else if(s.options)answer.addEventListener('change',()=>{});}}
    async function loadJumuiya(){const{data,error}=await supabase.from('org_units').select('id,name').eq('unit_type','jumuiya').eq('parent_id',state.kigango_id).eq('is_active',true).order('name');if(error)throw error;jumuiyaRows=(data||[]).map(x=>({id:x.id,name:x.name}));}
    async function loadFamilies(){const{data,error}=await supabase.rpc('public_signup_families',{p_jumuiya:state.jumuiya_id});if(error)throw error;familyRows=(data||[]).map(x=>({id:x.id,name:`${x.family_name}${x.family_code?` · Na. ${x.family_code}`:''}`}));}
    function save(s){const a=document.getElementById('answer');if(s.key==='kigango')state.kigango_id=a.value;if(s.key==='jumuiya')state.jumuiya_id=a.value;if(s.key==='family')state.family_id=a.value;if(s.key==='new_family')state.new_family_name=a.value.trim();if(s.key==='name')state.members[s.i].full_name=a.value.trim();if(s.key==='relation')state.members[s.i].relationship=a.value;if(s.key==='gender')state.members[s.i].gender=a.value;if(s.key==='age')state.members[s.i].age=a.value;if(s.key==='phone')state.members[s.i].phone=a.value.trim();if(s.key==='consent')state.consent=a.checked;}
    function validate(s){const m=state.members[s.i];if(s.key==='kigango'&&!state.kigango_id)return'Chagua kigango ili uendelee.';if(s.key==='jumuiya'&&!state.jumuiya_id)return'Chagua jumuiya ili uendelee.';if(s.key==='new_family'&&!state.new_family_name)return'Andika jina la familia.';if(s.key==='family'&&!state.family_id)return'Chagua familia yako.';if(s.key==='name'&&!m.full_name)return'Andika jina kamili.';if(s.key==='relation'&&!m.relationship)return'Chagua uhusiano wake na familia.';if(s.key==='age'&&(!Number.isInteger(Number(m.age))||Number(m.age)<0||Number(m.age)>120))return'Andika umri sahihi kuanzia miaka 0 hadi 120.';if(s.key==='phone'&&!/^\+?[0-9 ()-]{9,18}$/.test(m.phone))return'Andika namba sahihi ya simu.';if(s.key==='consent'&&!state.consent)return'Tafadhali thibitisha una ruhusa ya kusajili taarifa hizi.';return''}
    async function submit(){busy=true;next.disabled=true;next.textContent='Inasajili…';const members=state.members.map(m=>({...m,age:Number(m.age)}));const normalized=members.map(x=>x.phone.replace(/\D/g,''));if(new Set(normalized).size!==normalized.length){busy=false;next.disabled=false;render();say('Kila mtu aandike namba yake ya simu tofauti.');return}const payload={consent:state.consent,kigango_id:state.kigango_id,jumuiya_id:state.jumuiya_id,family_id:state.is_head?null:state.family_id,new_family_name:state.is_head?state.new_family_name:null,head_index:state.is_head?0:null,members};try{const r=await fetch('api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await r.json().catch(()=>({}));if(!r.ok)throw new Error(result.error||'Usajili haujakamilika. Jaribu tena.');document.getElementById('form-wrap').hidden=true;document.getElementById('success').classList.add('show');document.getElementById('success-message').textContent=result.sms_sent===result.sms_total?`Akaunti ${result.members} zimetengenezwa. Taarifa za kuingia zimetumwa kwa SMS kwenye simu za kila mtu.`:`Akaunti zimetengenezwa; SMS zimefika kwa ${result.sms_sent} kati ya ${result.sms_total}. Wasiliana na Msimamizi kwa majina ambayo hayajapokea SMS.`}catch(e){busy=false;next.disabled=false;render();say(e.message||'Usajili umeshindikana. Jaribu tena.')}}
    next.addEventListener('click',async()=>{if(busy)return;const all=steps(),s=all[stepIndex];if(s.key==='review'){await submit();return}save(s);const error=validate(s);if(error){say(error);return}if(s.key==='head'){const picked=document.querySelector('input[name="answer"]:checked');if(!picked){say('Chagua jibu moja.');return}state.is_head=picked.value==='yes';if(!state.is_head){state.members=state.members.slice(0,1);state.add_more=false;if(state.jumuiya_id)try{await loadFamilies()}catch{say('Orodha ya familia haikupatikana. Jaribu tena.');return}}}if(s.key==='more'){const picked=document.querySelector('input[name="answer"]:checked');if(!picked){say('Chagua ndiyo au hapana.');return}state.add_more=picked.value==='yes';if(state.add_more){if(state.members.length>=12){say('Usajili mmoja unaweza kuwa na watu wasiozidi 12.');return}state.members.push({full_name:'',relationship:'',gender:'',age:'',phone:''})}}stepIndex++;render()});
    back.addEventListener('click',()=>{if(stepIndex>0){stepIndex--;render()}});
    document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.id==='answer'&&e.target.tagName==='INPUT'){e.preventDefault();next.click()}});
    supabase.from('org_units').select('id,name').eq('unit_type','kigango').eq('is_active',true).order('name').then(({data,error})=>{if(error)throw error;kigangoRows=(data||[]).map(x=>({id:x.id,name:x.name}));render()}).catch(()=>say('Orodha ya vigango haikupatikana. Hakiki mtandao ujaribu tena.'));
    render();
  })();
  </script>
</body>
</html>
